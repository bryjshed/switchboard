# Signs in as the seeded owner. Other flows call this with runFlow.
appId: io.switchboard.app
---
# clearState wipes the dev client's saved bundler URL, so on next launch it falls back to
# the default port 8081. If another project's Metro squats there, this app loads THAT
# project's JavaScript and red-screens on a missing native module -- and once the red box
# has focus, a deep link can no longer switch bundlers. So: clear, stop, then cold-start
# straight into our bundler via the dev-client URL.
- launchApp:
    clearState: true
- stopApp
- openLink: io.switchboard.app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8092
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 90000
- tapOn:
    id: "login-email"
- inputText: "alice@switchboard.dev"
- tapOn:
    id: "login-password"
- inputText: "password123"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "flags-screen"
    timeout: 20000
- takeScreenshot: artifacts/01-signed-in
