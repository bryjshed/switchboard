# The kill-switch drill: from the list, long-press to kill a flag in under a handful of taps.
appId: io.switchboard.app
---
- runFlow: 01-login.yaml

- tapOn:
    id: "flags-env-switcher-env-production"
- assertVisible:
    id: "flag-card-planner-v2"

# Long-press opens the confirm sheet (with a warning haptic).
- longPressOn:
    id: "flag-card-planner-v2"
- assertVisible:
    id: "flag-card-planner-v2-kill-confirm"
- takeScreenshot: artifacts/03-kill-confirm
- tapOn:
    id: "flag-card-planner-v2-kill-confirm"

# The env pill flips optimistically to the killed treatment.
- assertVisible:
    id: "flag-card-planner-v2-env-production"
- takeScreenshot: artifacts/03-killed

# Undo it from the detail screen so the flow is re-runnable.
- tapOn:
    id: "flag-card-planner-v2"
- assertVisible:
    id: "flag-detail-screen"
- scrollUntilVisible:
    element:
      id: "env-card-production-kill-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "env-card-production-kill-button"
- tapOn:
    id: "env-card-production-kill-confirm"
- takeScreenshot: artifacts/03-restored
