services:
  postgres:
    image: postgres:18
    ports:
      # Host port is switchboard-specific (25432) so this stack coexists with other
      # local projects (nexus uses 15432); container listens on 5432 internally.
      - "25432:5432"
    environment:
      POSTGRES_DB: switchboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # PG18 images mount data at /var/lib/postgresql (not .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  firebase-emulator:
    image: node:22-slim
    ports:
      - "29099:9099"
    working_dir: /app
    stop_grace_period: 30s
    volumes:
      - ./firebase.json:/app/firebase.json:ro
      - firebase-data:/app/emulator-data
    # Emulator UI deliberately not started (its download URL flakes); auth only.
    command: >
      bash -c "npm install -g firebase-tools &&
               mkdir -p /app/emulator-data &&
               if [ -f /app/emulator-data/data/firebase-export-metadata.json ]; then IMPORT='--import=/app/emulator-data/data'; else IMPORT=''; fi &&
               exec firebase emulators:start --only auth --project demo-switchboard $$IMPORT --export-on-exit=/app/emulator-data/data"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9099/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
  firebase-data:
