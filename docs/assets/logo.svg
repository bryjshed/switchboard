<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="360" height="72"
     role="img" aria-label="Switchboard">
  <title>Switchboard</title>

  <!-- The mark: a toggle in its off position, inside a rounded tile. -->
  <rect x="4" y="8" width="56" height="56" rx="16" fill="#17181A"/>
  <rect x="18" y="26" width="28" height="20" rx="10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="28" cy="36" r="4.5" fill="#FFFFFF"/>

  <text x="76" y="47"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.4" fill="#17181A">Switchboard</text>
</svg>
