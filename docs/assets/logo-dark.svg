<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="360" height="72"
     role="img" aria-label="Switchboard">
  <title>Switchboard</title>

  <!-- Dark-theme variant: the tile inverts so the mark keeps its contrast against a dark page.
       GitHub picks between this and logo.svg with a <picture> media query. -->
  <rect x="4" y="8" width="56" height="56" rx="16" fill="#F5F5F4"/>
  <rect x="18" y="26" width="28" height="20" rx="10" fill="none" stroke="#17181A" stroke-width="2.5"/>
  <circle cx="28" cy="36" r="4.5" fill="#17181A"/>

  <text x="76" y="47"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.4" fill="#F5F5F4">Switchboard</text>
</svg>
