spring:
  application:
    name: switchboard
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:25432}/${DB_NAME:switchboard}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      initial-size: 2
      max-size: 10
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:25432}/${DB_NAME:switchboard}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    locations: classpath:db/migration
    placeholders:
      # V4 migrates existing users.firebase_uid values into user_identities and needs the
      # Firebase issuer, which is a function of the project id and unknowable from SQL.
      firebase_issuer: https://securetoken.google.com/${FIREBASE_PROJECT_ID:demo-switchboard}

server:
  port: ${SERVER_PORT:28080}

management:
  # Actuator moves to its own port so the scrape endpoint is never on the public listener. NOTE
  # this takes /actuator/health with it: health and readiness probes must target MANAGEMENT_PORT,
  # not SERVER_PORT, where the path now 404s.
  #
  # SecurityConfig's filter chain still applies to this listener, so health/info/prometheus are
  # named permitAll there. The port, not the filter chain, is the boundary - bind it to the pod
  # or host network and do not publish it.
  server:
    port: ${MANAGEMENT_PORT:28081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

switchboard:
  security:
    dev-auth-enabled: false
  # Identity providers. More than one may be active at once - an org migrating from one IdP to
  # another needs both to verify while the move is in flight. Routing is by the token's issuer.
  auth:
    providers:
      - id: firebase-local
        type: firebase
        project-id: ${FIREBASE_PROJECT_ID:demo-switchboard}
      # Any OIDC issuer works the same way. Uncomment, point it at your IdP, and tokens from it
      # authenticate against this API with no code change:
      # - id: corp-okta
      #   type: oidc
      #   issuer: https://example.okta.com/oauth2/default
      #   audience: switchboard
      #   email-claim: email          # 'email' everywhere except a few IdPs
      #   name-claim: name            # Entra ID often prefers 'preferred_username'
      #   jwk-set-uri:                # optional; omit to use OIDC discovery on the issuer
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
  jobs:
    token: ${JOB_TOKEN:}
    scheduled-enabled: ${JOBS_SCHEDULED_ENABLED:true}
  # The healing / optimizing loop. Note what is NOT here: a scan interval that affects the
  # decision. The statistic is anytime-valid, so scanning more often costs nothing in error
  # rate -- which is exactly what was untrue of the fixed-horizon z-test this replaced.
  rollout-monitor:
    enabled: true
    # Distinct SUBJECTS per arm, not evaluation events. A normal-approximation guard; the
    # e-value is valid at any sample size.
    min-subjects: 200
    # Ceiling on the evidence window. Past this the martingale restarts at a clock time rather
    # than at an allocation change, which is still valid but weakens the guarantee from
    # "at most alpha forever" to "at most alpha per window". Findings record when it binds.
    max-lookback: P30D
    metrics:
      error-key: error
      conversion-key: conversion
    # Asymmetric on purpose: a false rollback reverts to a known-good baseline and is cheap to
    # undo, while a false ramp pushes a worse variant onto more traffic and locks in the next
    # rung of the ladder.
    alpha:
      heal: 0.05
      optimize: 0.01
      srm: 0.001
    # Absolute proportion differences worth reacting to. Set these from what you care about --
    # never fit them to the observed effect, which would destroy the guarantee silently.
    tau:
      error: 0.01
      conversion: 0.02
    srm:
      enabled: true
      min-subjects: 500
      concentration: 1.0
