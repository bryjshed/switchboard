    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '204':
          description: Deleted

  /api/webhooks/{webhookId}/deliveries:
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      description: >-
        Recent delivery attempts - the answer to "did my endpoint actually receive it". Retries
        share an eventId with the original, so a receiver can dedupe across them.
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 50
      responses:
        '200':
          description: Delivery attempts, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDeliveryResponse'

  /api/projects/{projectId}/metrics:
    get:
      tags: [Metrics]
      operationId: listMetricDefinitions
      description: >-
        The metrics the rollout monitor may act on for this project. Every project is seeded with
        `error` and `conversion`, which are the two the monitor used to hard-code.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Metric definitions, by key.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricDefinitionResponse'
    post:
      tags: [Metrics]
      operationId: createMetricDefinition
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricDefinitionCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinitionResponse'
        '400':
