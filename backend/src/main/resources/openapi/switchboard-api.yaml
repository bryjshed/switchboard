        '409':
          description: That key is already defined for this project

  /api/metrics/{metricId}:
    patch:
      tags: [Metrics]
      operationId: updateMetricDefinition
      description: Partial update. The KEY is immutable - events already carry it.
      parameters:
        - $ref: '#/components/parameters/MetricId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricDefinitionUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinitionResponse'
    delete:
      tags: [Metrics]
      operationId: deleteMetricDefinition
      description: >-
        Stops the monitor acting on this metric. Events already recorded under the key are NOT
        deleted - they are telemetry, and a metric may be redefined later.
      parameters:
        - $ref: '#/components/parameters/MetricId'
      responses:
        '204':
          description: Deleted

  /api/orgs/{orgId}/audit/export:
    get:
      # Its own tag so the generated interface is separate and left unimplemented, exactly as
      # StreamApi is - see AuditExportController for why the binding is hand-written.
      tags: [AuditExport]
      operationId: exportOrgAudit
      description: >-
        Streams every audit entry for the org, oldest first, as NDJSON (default) or CSV.


        HAND-WRITTEN BINDING, like /api/stream and the OFREP endpoints: a generated method is
        fixed to one response type and this answers one operation in two formats, streamed. The
        path and parameters are declared here; only the binding is manual.


        NDJSON - one object per line - rather than a JSON array, because an array obliges the
        consumer to hold the whole export in memory to parse it, which defeats the point. The org
        that most needs an export is the one whose audit table will not fit in a response body.


        Deliberately not paginated: an export is asked for once and expected to be complete, so a
        cursor would only add a way to miss rows between pages.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [ndjson, csv]
            default: ndjson
        - name: since
          in: query
          required: false
          description: ISO-8601 instant. An unparseable value is a 400, never a silent full export.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Streamed audit rows.
          content:
            application/x-ndjson:
              schema:
                type: string
            text/csv:
              schema:
                type: string
        '400':
          description: Malformed `since`
        '403':
          description: Requires VIEW_AUDIT in the org

  /api/jobs/audit-retention:
    post:
      tags: [Jobs]
      operationId: runAuditRetention
      description: >-
        Prunes audit entries older than `switchboard.audit.retention-months`.


        DISABLED BY DEFAULT (0 = keep forever), which is the opposite of event retention. Event
        rows are telemetry and expiring them is housekeeping; audit rows are the record a
        compliance review or a post-mortem needs, so deleting them is an act that should have an
        owner rather than a default nobody chose.


        Deletes in bounded batches - the table is not partitioned, so unlike the event roll this
        is a row-wise DELETE whose cost scales with the rows removed.
      parameters:
        - $ref: '#/components/parameters/JobToken'
      responses:
        '200':
          description: Retention result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'
        '403':
          description: Missing or wrong X-Job-Token

  /api/jobs/rollout-scan:
    post:
      tags: [Jobs]
      operationId: runRolloutScan
      security: []
      parameters:
        - $ref: '#/components/parameters/JobToken'
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'

  /api/jobs/stale-flag-scan:
    post:
      tags: [Jobs]
      operationId: runStaleFlagScan
      security: []
      parameters:
        - $ref: '#/components/parameters/JobToken'
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'

  /api/jobs/webhook-sweep:
    post:
      tags: [Jobs]
      operationId: runWebhookSweep
      description: >-
        Retries webhook deliveries that are due. Idempotent and bounded by a batch size, so
        overlapping triggers are safe. An in-process timer also runs this every 30s; the
        endpoint exists for deployments that scale to zero, where no timer can fire.
      parameters:
        - $ref: '#/components/parameters/JobToken'
      responses:
        '200':
          description: Sweep result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'
        '403':
          description: Missing or wrong X-Job-Token

  /api/jobs/partition-roll:
    post:
      tags: [Jobs]
      operationId: runPartitionRoll
      security: []
      parameters:
        - $ref: '#/components/parameters/JobToken'
      responses:
        '200':
          description: Partition maintenance result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        OIDC ID token from any configured identity provider (Auth0, Okta, Entra ID,
        Keycloak, Cognito, Google, Firebase), or a dev token (Bearer dev:email) in the
        local profile.
    sdkKeyAuth:
      type: http
      scheme: bearer
      description: >-
        Environment SDK key. sb_srv_ (server, full rule set) or sb_cli_ (client, evaluated payloads
        and only client-side-available flags).
    ofrepApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        OFREP's apiKey scheme, carrying the same environment SDK key as sdkKeyAuth. A client key is
        restricted to flags marked clientSideAvailable here too - filtering only the bootstrap would
        leave flag existence enumerable one key at a time.
        Both headers resolve to the same SdkKeyPrincipal; Authorization wins when both are sent.

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MetricId:
      name: metricId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvId:
      name: envId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlagKey:
      name: flagKey
      in: path
      required: true
      schema:
        type: string
    EnvKey:
      name: envKey
      in: path
      required: true
      schema:
        type: string
    SegmentKey:
      name: segmentKey
      in: path
      required: true
      schema:
        type: string
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
