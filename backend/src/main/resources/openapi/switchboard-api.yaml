      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the token is for. Required, so it can be recognised before revoking it.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Omit for no expiry. Allowed, but an unattended forever-token is a liability.

    PersonalAccessTokenResponse:
      type: object
      required: [id, name, tokenPrefix, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tokenPrefix:
          type: string
          description: Display only, ellipsis included. Never enough to authenticate with.
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Advisory, updated off the request path. Useful for spotting dead weight.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true

    PersonalAccessTokenCreatedResponse:
      type: object
      required: [id, name, tokenPrefix, token, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tokenPrefix:
          type: string
        token:
          type: string
          description: The full token. Returned only here, never again, and stored only as a hash.
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    SdkKeyKind:
      type: string
      description: >-
        SERVER keys are secret and receive the full rule set, so they evaluate locally and see every
        flag. CLIENT keys ship inside a browser bundle and are therefore public: they receive
        EVALUATED payloads only, and only for flags marked clientSideAvailable. MOBILE is reserved
        and not yet mintable - it exists as its own kind because revoking a key baked into a shipped
        binary locks out installed versions until users update, which is a revocation-UX difference
        rather than a capability one.
      enum: [SERVER, CLIENT, MOBILE]
      default: SERVER

    SdkKeyCreateRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/SdkKeyKind'

    SdkKeyCreatedResponse:
