    EvalContext:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Stable context key (e.g. user id). Bucketing input.
        attributes:
          type: object
          description: >-
            Typed attribute values. Strings, numbers, booleans and arrays of those are all
            comparable; the OPERATOR decides how each side is read (see spec/evaluation.md 3.2), so
            a version string works with SEMVER_* and a number works with GREATER_THAN.
            null is treated as absent. Nested objects are dropped and nested arrays are flattened -
            no operator can act on either, and inventing a coercion would invent matches.
          additionalProperties: true

    BulkEvalRequest:
      type: object
      required: [context]
      properties:
        context:
