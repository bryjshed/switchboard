          format: uuid
        environmentId:
          type: string
          format: uuid
        envKey:
          type: string
        enabled:
          type: boolean
        killSwitchActive:
          type: boolean
        config:
          $ref: '#/components/schemas/FlagTargetingConfig'
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

    FlagDetailResponse:
