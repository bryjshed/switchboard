    ApprovalSettingsResponse:
      type: object
      required: [requireApproval, minApprovals, allowSelfApproval, requireApprovalForKill, allowAutomationBypass]
      properties:
        requireApproval:
          type: boolean
          description: Targeting writes and rollbacks open a change request instead of writing.
        minApprovals:
          type: integer
          description: How many reviewers other than the author (unless allowSelfApproval) must approve.
        allowSelfApproval:
          type: boolean
          description: When false the author's own approval is refused outright.
        requireApprovalForKill:
          type: boolean
          description: >
            Opt the kill switch into review as well. Off by default: the emergency
            stop bypasses approval so an incident cannot be blocked on a reviewer.
        allowAutomationBypass:
          type: boolean
          description: >
            ON BY DEFAULT, AND THIS IS THE ONE SETTING THAT LEAVES AN UNREVIEWED
            WRITE PATH OPEN. It only means anything when requireApproval is on, and
            only automation can use it: the rollout monitor's auto-rollback and
            auto-optimize keep writing immediately instead of opening a change
            request. A HUMAN applying an AI proposal is never covered - they are
            gated exactly like a hand edit. The default mirrors the kill switch:
            an automated rollback fires during an error spike and puts traffic back
            on the baseline variation that was already live, so making it wait for a
            reviewer removes the reason to automate it. Set it to false and automated
            healing parks in the review queue like everything else. Either way the
            write is audited, and a bypassed write additionally records an
            APPROVAL_BYPASS entry naming the automation as the actor.

    ApprovalSettingsUpdateRequest:
      type: object
      description: Omitted fields are left unchanged.
      properties:
        requireApproval:
          type: boolean
        minApprovals:
          type: integer
          minimum: 1
          maximum: 10
        allowSelfApproval:
          type: boolean
        requireApprovalForKill:
          type: boolean
        allowAutomationBypass:
          type: boolean
          description: >
            See ApprovalSettingsResponse.allowAutomationBypass. Defaults to true on
            every environment; turning it off is what makes automated rollout healing
            wait for review in a gated environment.

    ChangeRequestKind:
      type: string
      enum: [TARGETING_UPDATE, KILL_SWITCH, ROLLBACK]

    ChangeRequestStatus:
      type: string
      description: >
        PENDING is the only reviewable state. STALE means the flag moved past the
        request's baseVersion before it could be applied, so it was refused rather
        than allowed to clobber the newer version.
      enum: [PENDING, APPROVED, DECLINED, APPLIED, WITHDRAWN, STALE]

    ReviewDecision:
      type: string
      enum: [APPROVE, DECLINE]

    ChangeRequestPayload:
      type: object
      description: >
        The proposed write, in the shape the flag write endpoints take. Exactly the
        fields of one kind are populated - enabled+config for TARGETING_UPDATE,
        active for KILL_SWITCH, toVersion for ROLLBACK.
      properties:
        enabled:
          type: boolean
        config:
          $ref: '#/components/schemas/FlagTargetingConfig'
        active:
          type: boolean
        toVersion:
          type: integer

    ChangeRequestReviewResponse:
      type: object
      required: [id, reviewerUserId, reviewer, decision, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reviewerUserId:
          type: string
          format: uuid
        reviewer:
          type: string
        decision:
          $ref: '#/components/schemas/ReviewDecision'
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChangeRequestResponse:
      type: object
      required: [id, orgId, projectId, environmentId, envKey, flagId, flagKey, kind, payload, baseVersion, minApprovals, allowSelfApproval, status, requestedBy, requestedByUserId, createdAt, reviews, approvalsMet]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        envKey:
          type: string
        flagId:
          type: string
          format: uuid
        flagKey:
          type: string
        kind:
          $ref: '#/components/schemas/ChangeRequestKind'
        payload:
          $ref: '#/components/schemas/ChangeRequestPayload'
        baseVersion:
          type: integer
          description: The head version the author edited against.
        minApprovals:
          type: integer
          description: Snapshotted from the environment when the request was opened.
        allowSelfApproval:
          type: boolean
        status:
          $ref: '#/components/schemas/ChangeRequestStatus'
        requestedByUserId:
          type: string
          format: uuid
        requestedBy:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        appliedVersion:
          type: integer
          description: The config version this request produced once applied.
        aiProposalId:
          type: string
          format: uuid
          description: >
            Set when this request exists because an AI proposal was applied into an
            environment that requires approval. The proposal stays DRAFT until the
            request applies, and becomes APPLIED when the last of its requests lands.
        approvalsMet:
          type: integer
          description: Approvals that count toward the threshold right now.
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequestReviewResponse'

    ChangeRequestListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequestResponse'
        nextCursor:
          type: string

    ChangeRequestDecisionRequest:
      type: object
      properties:
        comment:
          type: string
