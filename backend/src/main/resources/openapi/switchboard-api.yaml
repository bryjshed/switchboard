    # ---------------------------------------------------------------- OFREP
    # OFREP 0.3.0 wire shapes. Every one of these is bound by a hand-written record in
    # com.switchboard.interfaces.rest.ofrep (see schemaMappings in pom.xml), because the generator
    # cannot express "value is boolean|string|number|object" or the success/failure union below
    # without losing the wire shape - and for OFREP the wire shape is the entire deliverable.
    OfrepContext:
      type: object
      description: >
        OpenFeature evaluation context. targetingKey is the Switchboard context key (the bucketing
        input). Every other property becomes a Switchboard attribute; attributes are strings, so
        scalars are coerced with String.valueOf - booleans become "true"/"false" and numbers their
        JSON text. Nested objects and arrays are SKIPPED rather than stringified, since no
        targeting clause could use the result.
      required: [targetingKey]
      properties:
        targetingKey:
          type: string
      additionalProperties: true

    OfrepEvaluationRequest:
      type: object
      required: [context]
      properties:
        context:
          $ref: '#/components/schemas/OfrepContext'

    OfrepReason:
      type: string
      description: >
        OpenFeature resolution reason. Mapped from the Switchboard reason, which is preserved
        verbatim in metadata["switchboard.reason"]:
        KILL_SWITCH and FLAG_OFF -> DISABLED; TARGET_MATCH and RULE_MATCH -> TARGETING_MATCH;
        ROLLOUT -> SPLIT; DEFAULT -> STATIC; a resolved variation that no longer exists -> UNKNOWN.
      enum: [STATIC, TARGETING_MATCH, SPLIT, DISABLED, UNKNOWN]

    OfrepErrorCode:
      type: string
      description: OpenFeature error codes Switchboard can emit.
      enum: [PARSE_ERROR, TARGETING_KEY_MISSING, INVALID_CONTEXT, FLAG_NOT_FOUND, GENERAL]

    OfrepMetadata:
      type: object
      description: >
        Free-form flag metadata. OFREP restricts values to scalars. Switchboard fills it with what
        OFREP has no field for - switchboard.reason (the native reason), switchboard.flagVersion,
        switchboard.flagKind, switchboard.variationId and, on a rule match, switchboard.ruleId.
      additionalProperties:
        oneOf:
          - type: boolean
          - type: string
          - type: number

    OfrepEvaluationSuccess:
      type: object
      required: [key, value, reason]
      properties:
        key:
          type: string
        value:
          description: >
            BOOLEAN flags emit a real JSON boolean, never the string "true". STRING flags emit the
            stored string verbatim - values are never sniffed for numbers or JSON, because
            OpenFeature type-checks client side and a wrong guess is worse than a string.
          oneOf:
            - type: boolean
            - type: string
            - type: number
            - type: object
        reason:
          $ref: '#/components/schemas/OfrepReason'
        variant:
          type: string
          description: The variation's name, falling back to its value when the variation is unnamed.
        metadata:
          $ref: '#/components/schemas/OfrepMetadata'

    OfrepEvaluationFailure:
      type: object
      description: >
        OFREP evaluationFailure and flagNotFound. Also the bulk endpoint's 400 body
        (bulkEvaluationFailure), which has no key - one shape, with nulls omitted.
      required: [errorCode]
      properties:
        key:
          type: string
        errorCode:
          $ref: '#/components/schemas/OfrepErrorCode'
        errorDetails:
          type: string
        metadata:
          $ref: '#/components/schemas/OfrepMetadata'

    OfrepFlagEvaluation:
      description: One entry of the bulk flags array - a success or a failure.
      oneOf:
        - $ref: '#/components/schemas/OfrepEvaluationSuccess'
        - $ref: '#/components/schemas/OfrepEvaluationFailure'

    OfrepEventStreamEndpoint:
      type: object
      required: [requestUri]
      properties:
        origin:
          type: string
          description: Omitted by Switchboard, so the provider joins requestUri to its configured OFREP base URL.
        requestUri:
          type: string
          example: /ofrep/v1/stream

    OfrepEventStream:
      type: object
      required: [type]
      properties:
        type:
          type: string
          example: sse
        endpoint:
          $ref: '#/components/schemas/OfrepEventStreamEndpoint'
        inactivityDelaySec:
          type: integer
          example: 120

    OfrepBulkEvaluationResponse:
      type: object
      required: [flags]
      properties:
        flags:
          type: array
          items:
            $ref: '#/components/schemas/OfrepFlagEvaluation'
        metadata:
          $ref: '#/components/schemas/OfrepMetadata'
        eventStreams:
          type: array
          description: Advertised only because /ofrep/v1/stream really serves it - a connected provider stops polling.
          items:
            $ref: '#/components/schemas/OfrepEventStream'

    OfrepSseEventData:
      type: object
      description: The JSON payload inside an SSE data line on /ofrep/v1/stream.
      required: [type]
      properties:
        type:
          type: string
          example: refetchEvaluation
        etag:
          type: string
          description: The new quoted ETag, byte-identical to what the bulk endpoint would return.
          example: '"42"'

    OfrepGeneralError:
      type: object
      properties:
        errorDetails:
          type: string

    Permission:
      type: string
      description: A capability the backend checks by name. Roles bundle these.
      enum: [FLAG_READ, FLAG_WRITE, FLAG_KILL, FLAG_ROLLBACK, SEGMENT_WRITE, APPROVE_CHANGES, MANAGE_MEMBERS, MANAGE_SDK_KEYS, MANAGE_SETTINGS, MANAGE_PROJECTS, MANAGE_ENVIRONMENTS, VIEW_AUDIT]

