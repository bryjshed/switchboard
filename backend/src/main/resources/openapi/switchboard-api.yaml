openapi: 3.0.3
info:
  title: Switchboard API
  description: AI-powered feature flag platform. Management surface (user bearer auth), SDK surface (SDK-key auth), and job triggers.
  version: 0.1.0
servers:
  - url: http://localhost:28080
security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Orgs
  - name: Projects
  - name: Environments
  - name: Flags
  - name: Segments
  - name: Audit
  - name: Evaluation
  - name: Stream
  - name: Events
  - name: Ofrep
  - name: Ai
  - name: Access
  - name: ChangeRequests
  - name: Jobs

paths:
  /api/users/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user; auto-provisions on first call.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /api/orgs:
    post:
      tags: [Orgs]
      operationId: createOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgCreateRequest'
      responses:
        '201':
          description: Created org
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'
    get:
      tags: [Orgs]
      operationId: listOrgs
      responses:
        '200':
          description: Orgs the caller belongs to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgResponse'

  /api/orgs/{orgId}:
    get:
      tags: [Orgs]
      operationId: getOrg
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Org detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'

  /api/orgs/{orgId}/members:
    get:
      tags: [Orgs]
      operationId: listOrgMembers
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgMemberResponse'
    post:
      tags: [Orgs]
      operationId: addOrgMember
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgMemberAddRequest'
      responses:
        '201':
          description: Added member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberResponse'

  /api/orgs/{orgId}/members/{userId}:
    delete:
      tags: [Orgs]
      operationId: removeOrgMember
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed

  /api/orgs/{orgId}/settings:
    get:
      tags: [Orgs]
      operationId: getOrgSettings
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Org settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettingsResponse'
    put:
      tags: [Orgs]
      operationId: updateOrgSettings
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSettingsUpdateRequest'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettingsResponse'

  /api/orgs/{orgId}/projects:
    post:
      tags: [Projects]
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Created project (environments dev/staging/production auto-seeded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    get:
      tags: [Projects]
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponse'

  /api/projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    patch:
      tags: [Projects]
      operationId: updateProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /api/projects/{projectId}/environments:
    get:
      tags: [Environments]
      operationId: listEnvironments
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvironmentResponse'
    post:
      tags: [Environments]
      operationId: createEnvironment
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentCreateRequest'
      responses:
        '201':
          description: Created environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentResponse'

  /api/environments/{envId}/sdk-keys:
    post:
      tags: [Environments]
      operationId: createSdkKey
      parameters:
        - $ref: '#/components/parameters/EnvId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SdkKeyCreateRequest'
      responses:
        '201':
          description: Created key. The full key is returned ONLY here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdkKeyCreatedResponse'
    get:
      tags: [Environments]
      operationId: listSdkKeys
      parameters:
        - $ref: '#/components/parameters/EnvId'
      responses:
        '200':
          description: Keys (prefixes only)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SdkKeyResponse'

  /api/sdk-keys/{keyId}:
    delete:
      tags: [Environments]
      operationId: revokeSdkKey
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked

  /api/projects/{projectId}/flags:
    post:
      tags: [Flags]
      operationId: createFlag
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagCreateRequest'
      responses:
        '201':
          description: Created flag with default env configs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagDetailResponse'
    get:
      tags: [Flags]
      operationId: listFlags
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: query
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Flags with per-environment summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagListResponse'

  /api/projects/{projectId}/flags/{flagKey}:
    get:
      tags: [Flags]
      operationId: getFlag
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlagKey'
      responses:
        '200':
          description: Flag detail incl. all environment configs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagDetailResponse'
    patch:
      tags: [Flags]
      operationId: updateFlag
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlagKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagUpdateRequest'
      responses:
        '200':
          description: Updated flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagDetailResponse'
    delete:
      tags: [Flags]
      operationId: archiveFlag
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlagKey'
      responses:
        '204':
          description: Archived (soft delete)

  /api/projects/{projectId}/flags/{flagKey}/environments/{envKey}:
    put:
      tags: [Flags]
      operationId: updateFlagEnvConfig
      summary: Full targeting-config write; versioned with optimistic concurrency.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlagKey'
        - $ref: '#/components/parameters/EnvKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagEnvConfigUpdateRequest'
      responses:
        '200':
          description: New config version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagEnvConfigResponse'
        '202':
          description: >
            The environment requires approval. NOTHING WAS WRITTEN: the flag is
            unchanged and the body is the PENDING change request that now stands in
            for this write. Clients must branch on the status code, not the body -
            200 means a new config version exists, 202 means one is waiting for
            review. The Location header points at the change request.
          headers:
            Location:
              description: The change request this write was parked as.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '409':
          description: expectedVersion is stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/projects/{projectId}/flags/{flagKey}/environments/{envKey}/kill-switch:
    post:
      tags: [Flags]
      operationId: setKillSwitch
      summary: One-tap kill switch; never version-conflicts.
      description: >
        THE KILL SWITCH BYPASSES APPROVAL BY DEFAULT, even in an environment with
        requireApproval on. It is an emergency stop, and a review queue in front of
        "turn it off now" turns an incident into an outage. Set
        requireApprovalForKill on the environment to opt this route into review as
        well, in which case it can answer 202 like the other writes.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlagKey'
        - $ref: '#/components/parameters/EnvKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillSwitchRequest'
      responses:
        '200':
          description: New config version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagEnvConfigResponse'
        '202':
          description: >
            The environment requires approval. NOTHING WAS WRITTEN: the flag is
            unchanged and the body is the PENDING change request that now stands in
            for this write. Clients must branch on the status code, not the body -
            200 means a new config version exists, 202 means one is waiting for
            review. The Location header points at the change request.
          headers:
            Location:
              description: The change request this write was parked as.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'

  /api/projects/{projectId}/flags/{flagKey}/environments/{envKey}/versions:
    get:
      tags: [Flags]
      operationId: listFlagVersions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlagKey'
        - $ref: '#/components/parameters/EnvKey'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Version history, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagVersionListResponse'

  /api/projects/{projectId}/flags/{flagKey}/environments/{envKey}/versions/{versionNumber}:
    get:
      tags: [Flags]
      operationId: getFlagVersion
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlagKey'
        - $ref: '#/components/parameters/EnvKey'
        - name: versionNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: One version snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagVersionResponse'

  /api/projects/{projectId}/flags/{flagKey}/environments/{envKey}/rollback:
    post:
      tags: [Flags]
      operationId: rollbackFlagEnvConfig
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlagKey'
        - $ref: '#/components/parameters/EnvKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '200':
          description: New config version copying the target snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagEnvConfigResponse'
        '202':
          description: >
            The environment requires approval. NOTHING WAS WRITTEN: the flag is
            unchanged and the body is the PENDING change request that now stands in
            for this write. Clients must branch on the status code, not the body -
            200 means a new config version exists, 202 means one is waiting for
            review. The Location header points at the change request.
          headers:
            Location:
              description: The change request this write was parked as.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'

  /api/projects/{projectId}/segments:
    post:
      tags: [Segments]
      operationId: createSegment
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentUpsertRequest'
      responses:
        '201':
          description: Created segment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
    get:
      tags: [Segments]
      operationId: listSegments
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentResponse'

  /api/projects/{projectId}/segments/{segmentKey}:
    get:
      tags: [Segments]
      operationId: getSegment
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SegmentKey'
      responses:
        '200':
          description: Segment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
    put:
      tags: [Segments]
      operationId: updateSegment
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SegmentKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentUpsertRequest'
      responses:
        '200':
          description: Updated segment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
    delete:
      tags: [Segments]
      operationId: deleteSegment
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SegmentKey'
      responses:
        '204':
          description: Deleted

  /api/projects/{projectId}/audit:
    get:
      tags: [Audit]
      operationId: listProjectAudit
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: env
          in: query
          schema:
            type: string
        - name: flagKey
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'

  /api/orgs/{orgId}/audit:
    get:
      tags: [Audit]
      operationId: listOrgAudit
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'

  /api/eval:
    post:
      tags: [Evaluation]
      operationId: evaluateAll
      security:
        - sdkKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkEvalRequest'
      responses:
        '200':
          description: Evaluation results for every non-archived flag in the key's environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkEvalResponse'

  /api/eval/{flagKey}:
    post:
      tags: [Evaluation]
      operationId: evaluateFlag
      security:
        - sdkKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleEvalRequest'
      responses:
        '200':
          description: Evaluation result. Unknown flag echoes the supplied default with reason SDK_DEFAULT - never an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalResult'

  /api/eval/bootstrap:
    get:
      tags: [Evaluation]
      operationId: getBootstrap
      security:
        - sdkKeyAuth: []
      parameters:
        - name: contextKey
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Full environment flag payload; ETag is the environment stateVersion.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '304':
          description: Not modified (If-None-Match matched current stateVersion)

  /api/stream:
    get:
      tags: [Stream]
      operationId: streamChanges
      security:
        - sdkKeyAuth: []
      responses:
        '200':
          description: SSE stream. Events - put (full payload on connect), patch (single flag config), ping (15s heartbeat). Event id is the environment stateVersion; reconnect with Last-Event-ID for catch-up.
          content:
            text/event-stream:
              schema:
                type: string

  /api/events/eval:
    post:
      tags: [Events]
      operationId: ingestEvalEvents
      security:
        - sdkKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalEventBatch'
      responses:
        '202':
          description: Accepted

  /api/events/metrics:
    post:
      tags: [Events]
      operationId: ingestMetricEvents
      security:
        - sdkKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricEventBatch'
      responses:
        '202':
          description: Accepted

  # ---------------------------------------------------------------- OFREP
  # The OpenFeature Remote Evaluation Protocol (OFREP 0.3.0), served over the same SDK key and the
  # same evaluation engine as /api/eval. Implementing it verbatim is what makes the six
  # OpenFeature-maintained providers work against Switchboard with no Switchboard-specific code.
  #
  # These three operations are bound by HAND (OfrepController, OfrepStreamController) rather than
  # by the generated OfrepApi, exactly as /api/stream is: one OFREP operation answers with three
  # different body schemas (success, evaluationFailure, flagNotFound), the bulk operation answers
  # with either a body or a bodiless 304, and the stream is infinite - none of which a generated
  # single-response-type signature can express. The contract below is still the source of truth.
  #
  # 429 is documented by OFREP but NOT implemented: Switchboard has no rate limiter, so it is
  # omitted here rather than advertised and never sent.
  /ofrep/v1/evaluate/flags/{key}:
    post:
      tags: [Ofrep]
      operationId: ofrepEvaluateFlag
      summary: OFREP single flag evaluation (dynamic context, server-side providers).
      description: >
        Evaluates one flag through the same FlagEvaluator as POST /api/eval/{flagKey}.
        Unlike that endpoint an unknown flag is a 404 FLAG_NOT_FOUND, because an OFREP provider
        owns its code default and expects to be told the flag is missing.
      security:
        - sdkKeyAuth: []
        - ofrepApiKeyAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfrepEvaluationRequest'
      responses:
        '200':
          description: Evaluated flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepEvaluationSuccess'
        '400':
          description: Malformed body (PARSE_ERROR), non-object context (INVALID_CONTEXT) or missing targetingKey (TARGETING_KEY_MISSING).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepEvaluationFailure'
        '401':
          description: No credentials. No body, per OFREP.
        '403':
          description: Credentials that are not an SDK key. No body, per OFREP.
        '404':
          description: No such flag in this SDK key's environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepEvaluationFailure'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepGeneralError'

  /ofrep/v1/evaluate/flags:
    post:
      tags: [Ofrep]
      operationId: ofrepEvaluateFlags
      summary: OFREP bulk evaluation (static context, client-side providers).
      description: >
        Evaluates every non-archived flag of the SDK key's environment. The ETag is the
        environment stateVersion quoted the same way GET /api/eval/bootstrap quotes it, so both
        conditional endpoints agree. The response advertises the OFREP SSE stream at
        /ofrep/v1/stream so a connected provider can stop polling.
      security:
        - sdkKeyAuth: []
        - ofrepApiKeyAuth: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: ETag from a previous bulk evaluation; a match answers 304 with no body.
          schema:
            type: string
        - name: flagConfigEtag
          in: query
          required: false
          description: OFREP change-triggered re-fetch metadata. Accepted and ignored - the ETag header is authoritative here.
          schema:
            type: string
        - name: flagConfigLastModified
          in: query
          required: false
          description: OFREP change-triggered re-fetch metadata. Accepted and ignored - Switchboard versions environments, it does not timestamp them.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfrepEvaluationRequest'
      responses:
        '200':
          description: Every flag of the environment, each entry a success or a failure.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepBulkEvaluationResponse'
        '304':
          description: Not modified (If-None-Match matched the current stateVersion). No body.
        '400':
          description: Malformed body or unusable context. Carries no key - OFREP's bulkEvaluationFailure has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepEvaluationFailure'
        '401':
          description: No credentials. No body, per OFREP.
        '403':
          description: Credentials that are not an SDK key. No body, per OFREP.
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepGeneralError'

  /ofrep/v1/stream:
    get:
      tags: [Ofrep]
      operationId: ofrepStreamChanges
      summary: OFREP change-notification stream (SSE).
      description: >
        One unnamed (default "message") event per change to this environment, carrying
        OfrepSseEventData with type refetchEvaluation and the new quoted ETag, plus an SSE comment
        every 30s as a keepalive. Fed by the same Postgres LISTEN and EnvironmentStreamHub as
        /api/stream, so an OFREP client and a native SDK client see a change at the same moment.
      security:
        - sdkKeyAuth: []
        - ofrepApiKeyAuth: []
      responses:
        '200':
          description: SSE stream of refetchEvaluation events.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: No credentials. No body, per OFREP.
        '403':
          description: Credentials that are not an SDK key. No body, per OFREP.

  /api/projects/{projectId}/ai/proposals:
    post:
      tags: [Ai]
      operationId: draftProposal
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalDraftRequest'
      responses:
        '201':
          description: Drafted proposal with typed diff and rationale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProposalResponse'
        '503':
          description: AI unavailable (no API key configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [Ai]
      operationId: listProposals
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, APPLIED, REJECTED, EXPIRED]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Proposals, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProposalListResponse'

  /api/ai/proposals/{proposalId}:
    get:
      tags: [Ai]
      operationId: getProposal
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProposalResponse'

  /api/ai/proposals/{proposalId}/apply:
    post:
      tags: [Ai]
      operationId: applyProposal
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalActionRequest'
      summary: Apply a DRAFT proposal, subject to the environment's approval policy.
      description: >
        The write an AI proposal makes is a flag write, so it answers to the same
        per-environment approval policy a hand edit does. In an environment with
        requireApproval on, applying a proposal WRITES NOTHING and opens a PENDING
        change request per environment instead, stamped with this proposal's id; the
        proposal stays DRAFT and becomes APPLIED when the last of those requests is
        approved and applied. A declined or stale request leaves the proposal DRAFT,
        so it can simply be applied again.

        THE ONE EXCEPTION IS AUTOMATION. The rollout monitor's auto-rollback and
        auto-optimize applies bypass this gate while the environment keeps
        allowAutomationBypass on, which is the default - a healing rollback that
        waits for a reviewer during an error spike is not healing. Those writes are
        audited as usual and additionally recorded as APPROVAL_BYPASS. This endpoint
        is a human path, so it never takes the bypass.
      responses:
        '200':
          description: Applied proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProposalResponse'
        '202':
          description: >
            The environment requires approval. NOTHING WAS WRITTEN: the flag is
            unchanged, the proposal is still DRAFT, and the body is the PENDING
            change request that now stands in for this apply. Clients must branch on
            the status code, not the body. The Location header points at the change
            request. When the proposal touched more than one environment, one request
            was opened per environment and this is the first of them.
          headers:
            Location:
              description: The change request this apply was parked as.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '409':
          description: Proposal is not in DRAFT status, or already has an open change request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/ai/proposals/{proposalId}/reject:
    post:
      tags: [Ai]
      operationId: rejectProposal
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalActionRequest'
      responses:
        '200':
          description: Rejected proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProposalResponse'

  /api/environments/{envId}/anomalies:
