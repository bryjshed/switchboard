      properties:
        id:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        keyPrefix:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        kind:
          $ref: '#/components/schemas/SdkKeyKind'

    FlagKind:
      type: string
