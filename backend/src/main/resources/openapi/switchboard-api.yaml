          type: string
        name:
          type: string

    FlagCreateRequest:
      type: object
      required: [key, name, kind]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        kind:
          $ref: '#/components/schemas/FlagKind'
        variations:
          type: array
          description: Required for STRING flags; ignored for BOOLEAN (always true/false).
          items:
            $ref: '#/components/schemas/VariationCreate'
        tags:
          type: array
          items:
            type: string
        clientSideAvailable:
          type: boolean
          description: >-
            Whether a holder of a PUBLIC SDK key (sb_cli_) may see this flag. Defaults to false, so
            no flag is exposed to a browser without someone deciding it should be. Has no effect on
            a server key, which sees every flag regardless.

    FlagUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        addVariations:
          type: array
          description: STRING flags only; variations are add-only.
          items:
            $ref: '#/components/schemas/VariationCreate'
        clientSideAvailable:
          type: boolean
          description: >-
            Whether a holder of a PUBLIC SDK key (sb_cli_) may see this flag. Defaults to false, so
            no flag is exposed to a browser without someone deciding it should be. Has no effect on
            a server key, which sees every flag regardless.

    ClauseOp:
      type: string
      description: >-
        How a clause compares an attribute against its values. Every operator is existential: it
        matches when the attribute relates to ANY listed value, and when ANY element of an
        array-valued attribute does.


        The operator decides how both sides are read. Clause values are always text on the wire;
        GREATER_THAN parses them as numbers, SEMVER_* as versions, BEFORE/AFTER as instants.
        A value that cannot be read that way makes the clause false rather than erroring.


        MATCHES is restricted to a portable regex subset - no lookaround, no backreferences, and a
        length cap - so the Java server and a JavaScript SDK cannot disagree about a pattern.


        NOT_SEGMENT_MATCH is deprecated in favour of SEGMENT_MATCH with negate=true. It is still
        accepted and still evaluates identically; nothing produces it any more.
      enum:
        - EQUALS
        - IN
        - CONTAINS
        - STARTS_WITH
        - ENDS_WITH
        - MATCHES
        - GREATER_THAN
        - GREATER_THAN_OR_EQUAL
        - LESS_THAN
        - LESS_THAN_OR_EQUAL
        - BEFORE
        - AFTER
        - SEMVER_EQUAL
        - SEMVER_GREATER_THAN
        - SEMVER_LESS_THAN
        - SEGMENT_MATCH
        - NOT_SEGMENT_MATCH

    Clause:
      type: object
      required: [attribute, op, values]
      properties:
        attribute:
          type: string
          description: Context attribute name; 'key' targets the context key. For SEGMENT_MATCH ops, values carry segment keys.
        op:
          $ref: '#/components/schemas/ClauseOp'
        negate:
          type: boolean
          description: >-
            Absent means false, which is every clause written before per-clause negation existed.


            Inverts the clause's result, INCLUDING the missing-attribute case. A missing attribute
            makes a clause false, so a negated clause on a missing attribute is TRUE - "plan is not
            free" holds for somebody with no plan attribute at all. This matches LaunchDarkly and is
            what the phrase means in English, but it surprises people, so it is pinned by
            conformance vectors.
        values:
          type: array
          items:
            type: string

    WeightedVariation:
      type: object
      required: [variationId, weight]
      properties:
        variationId:
          type: string
          format: uuid
        weight:
          type: integer
          minimum: 0
          maximum: 100

    RolloutOrVariation:
      type: object
      description: Exactly one of variationId or rollout must be set.
      properties:
        variationId:
          type: string
          format: uuid
        rollout:
          type: array
          description: Weights must sum to exactly 100.
          items:
            $ref: '#/components/schemas/WeightedVariation'

    IndividualTarget:
