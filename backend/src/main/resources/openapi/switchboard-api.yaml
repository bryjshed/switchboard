      properties:
        id:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        key:
          type: string
          description: Full SDK key. Returned only at creation.
        keyPrefix:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        kind:
          $ref: '#/components/schemas/SdkKeyKind'

    SdkKeyResponse:
      type: object
