        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChangeRequestResponse:
      type: object
      required: [id, orgId, projectId, environmentId, envKey, flagId, flagKey, kind, payload, baseVersion, minApprovals, allowSelfApproval, status, requestedBy, requestedByUserId, createdAt, reviews, approvalsMet]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        envKey:
          type: string
        flagId:
          type: string
          format: uuid
        flagKey:
          type: string
        kind:
          $ref: '#/components/schemas/ChangeRequestKind'
        payload:
          $ref: '#/components/schemas/ChangeRequestPayload'
        baseVersion:
          type: integer
          description: The head version the author edited against.
        minApprovals:
          type: integer
          description: Snapshotted from the environment when the request was opened.
        allowSelfApproval:
          type: boolean
        status:
          $ref: '#/components/schemas/ChangeRequestStatus'
        requestedByUserId:
          type: string
          format: uuid
        requestedBy:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        appliedVersion:
          type: integer
          description: The config version this request produced once applied.
        aiProposalId:
          type: string
          format: uuid
          description: >
            Set when this request exists because an AI proposal was applied into an
            environment that requires approval. The proposal stays DRAFT until the
            request applies, and becomes APPLIED when the last of its requests lands.
        approvalsMet:
          type: integer
          description: Approvals that count toward the threshold right now.
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequestReviewResponse'

    ChangeRequestListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequestResponse'
        nextCursor:
          type: string

    ChangeRequestDecisionRequest:
      type: object
      properties:
        comment:
          type: string

    WebhookEventType:
      type: string
      description: >-
        What a webhook can be told about. Kill switches and rollbacks are their own types
        rather than collapsing into flag.updated, because operators routinely alert on those
        two alone - a kill switch is an incident signal, an ordinary ramp is not.


        An AI apply and an approved change request both surface as flag.updated: what changed
        is the same thing, and who authorised it is already in the audit trail.
      enum:
        - flag.updated
        - flag.kill_switch
        - flag.rollback
        - rollout.finding

    WebhookCreateRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Absolute http(s) URL.
        description:
          type: string
        eventTypes:
          type: array
          description: >-
            EMPTY means every type, not none. A newly created webhook that delivered nothing
            would read as a broken integration rather than as a filter nobody set.
          items:
            $ref: '#/components/schemas/WebhookEventType'
        projectId:
          type: string
          format: uuid
          description: Narrows to one project. Omit for every project in the org.
        environmentId:
          type: string
          format: uuid
          description: Narrows to one environment. Omit for every environment.

    WebhookUpdateRequest:
      type: object
      properties:
        url:
          type: string
        description:
          type: string
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        projectId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        enabled:
          type: boolean

    WebhookResponse:
      type: object
      required: [id, orgId, url, eventTypes, enabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        url:
          type: string
        description:
          type: string
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        projectId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WebhookCreatedResponse:
      allOf:
        - $ref: '#/components/schemas/WebhookResponse'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: >-
                The HMAC-SHA256 signing secret, returned ONLY here. Sign-check incoming
                deliveries with it: the X-Switchboard-Signature header is
                "t=<unix>,v1=<hex>", and the signed material is "<t>.<raw body>" - the
                timestamp is INSIDE the MAC, so a captured delivery cannot be replayed
                forever. Compare in constant time.

    WebhookDeliveryStatus:
      type: string
      enum: [PENDING, DELIVERED, FAILED]

    WebhookDeliveryResponse:
      type: object
      required: [id, webhookId, eventId, eventType, status, attempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        webhookId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
          description: Shared across retries and across webhooks, so a receiver can dedupe.
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attempts:
          type: integer
        responseStatus:
          type: integer
        error:
          type: string
        nextAttemptAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time

    MetricDirection:
      type: string
      description: >-
        Which way is good. This is what lets the monitor tell a regression from an improvement,
        which is the entire decision it makes.


        Before metric definitions existed the answer was implicit in two hard-coded keys - `error`
        could only ever degrade and `conversion` could only ever improve - and that implicitness
        hid a real blind spot: a variation that DESTROYED conversion was never healed, because
        conversion was only ever tested for improvement.
      enum: [INCREASE_IS_BETTER, DECREASE_IS_BETTER]

    MetricDefinitionResponse:
      type: object
      required: [id, projectId, key, name, direction, tau, autoAct, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        key:
          type: string
          description: Matches the metricKey your SDK reports on POST /api/events/metrics.
        name:
          type: string
        description:
          type: string
        direction:
          $ref: '#/components/schemas/MetricDirection'
        tau:
          type: number
          description: >-
            The absolute proportion difference worth reacting to, between 0 and 1 exclusive.


            NEVER fit this to observed data. Deriving tau from the effect you are measuring makes
            the constant a function of the sample and destroys the supermartingale property that
            makes the monitor safe to run as often as it likes - see docs/DECISIONS.md.
        autoAct:
          type: boolean
          description: >-
            Whether the monitor may heal or ramp on this metric, or only report it. A team
            measuring something noisy wants to see it without it moving traffic.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MetricDefinitionCreateRequest:
      type: object
      required: [key, name, direction, tau]
      properties:
        key:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 100
        description:
          type: string
        direction:
          $ref: '#/components/schemas/MetricDirection'
        tau:
          type: number
        autoAct:
          type: boolean
          default: true

    MetricDefinitionUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        direction:
          $ref: '#/components/schemas/MetricDirection'
        tau:
          type: number
        autoAct:
          type: boolean
