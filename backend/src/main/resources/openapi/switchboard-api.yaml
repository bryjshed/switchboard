  /api/users/me/permissions:
    get:
      tags: [Access]
      operationId: getMyPermissions
      summary: What the caller may do at one scope, for hiding controls they cannot use.
      description: >
        Effective permissions are the UNION of the roles the caller holds at the
        requested scope and at every scope containing it. Pass envId for the
        narrowest answer, projectId for the project, or orgId alone. Exactly one of
        the three should be given; the narrowest one wins if more than one is.
      parameters:
        - name: orgId
          in: query
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: envId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The caller's effective permissions at that scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPermissionsResponse'

  /api/roles:
    get:
      tags: [Access]
      operationId: listRoles
      summary: Every assignable role and the permissions it grants.
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'

  /api/orgs/{orgId}/role-assignments:
    get:
      tags: [Access]
      operationId: listRoleAssignments
      summary: Role assignments anywhere under this org. Requires MANAGE_MEMBERS.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: scopeType
          in: query
          schema:
            $ref: '#/components/schemas/ScopeType'
        - name: scopeId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentListResponse'
    post:
      tags: [Access]
      operationId: grantRole
      summary: Grant a role at a scope. Requires MANAGE_MEMBERS on the org.
      description: >
        Upserts on (user, scope): granting again at the same scope replaces the
        role held there. The scope must belong to this org.
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentCreateRequest'
      responses:
        '201':
          description: The assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentResponse'

  /api/orgs/{orgId}/role-assignments/{assignmentId}:
    delete:
      tags: [Access]
      operationId: revokeRole
      summary: Revoke one role assignment. Requires MANAGE_MEMBERS on the org.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked

  /api/environments/{envId}/approval-settings:
    get:
      tags: [ChangeRequests]
      operationId: getApprovalSettings
      summary: This environment's approval policy.
      parameters:
        - $ref: '#/components/parameters/EnvId'
      responses:
        '200':
          description: Approval policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalSettingsResponse'
    put:
      tags: [ChangeRequests]
      operationId: updateApprovalSettings
      summary: Turn approval on or off for this environment. Requires MANAGE_ENVIRONMENTS.
      description: >
        Every field defaults to off, so an environment nobody has configured
        behaves exactly as it did before change requests existed. Omitted fields
        are left unchanged.
      parameters:
        - $ref: '#/components/parameters/EnvId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalSettingsUpdateRequest'
      responses:
        '200':
          description: The stored policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalSettingsResponse'

  /api/projects/{projectId}/change-requests:
    get:
      tags: [ChangeRequests]
      operationId: listChangeRequests
      summary: Change requests in this project, newest first (keyset cursor).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: envKey
          in: query
          schema:
            type: string
        - name: flagKey
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ChangeRequestStatus'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Change requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestListResponse'

  /api/change-requests/{changeRequestId}:
    get:
      tags: [ChangeRequests]
      operationId: getChangeRequest
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
      responses:
        '200':
          description: One change request with its reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'

  /api/change-requests/{changeRequestId}/approve:
    post:
      tags: [ChangeRequests]
      operationId: approveChangeRequest
      summary: Approve. Requires APPROVE_CHANGES in the request's environment.
      description: >
        The approval that meets minApprovals applies the change in the same call,
        through the normal versioned write path. If the flag has moved past the
        request's baseVersion the request goes STALE instead of overwriting the
        newer work, and the author has to rebase. Self-approval is refused unless
        the environment allows it.
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequestDecisionRequest'
      responses:
        '200':
          description: The change request after the review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '403':
          description: No APPROVE_CHANGES here, or self-approval is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request is no longer PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/change-requests/{changeRequestId}/decline:
    post:
      tags: [ChangeRequests]
      operationId: declineChangeRequest
      summary: Decline. One decline settles it. Requires APPROVE_CHANGES.
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequestDecisionRequest'
      responses:
        '200':
          description: The declined change request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'

  /api/change-requests/{changeRequestId}/withdraw:
    post:
      tags: [ChangeRequests]
      operationId: withdrawChangeRequest
      summary: Withdraw your own pending request.
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
      responses:
        '200':
          description: The withdrawn change request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '403':
          description: Only the author may withdraw
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/change-requests/{changeRequestId}/apply:
    post:
      tags: [ChangeRequests]
      operationId: applyChangeRequest
      summary: Idempotent retry for an APPROVED request whose write did not land.
      description: >
        Approvals auto-apply when the threshold is met, so this exists only for the
        case where that write failed. It refuses anything not already APPROVED, so
        it is not a way around review.
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
      responses:
        '200':
          description: The applied (or now STALE) change request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '409':
          description: The request is not APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/jobs/rollout-scan:
    post:
      tags: [Jobs]
      operationId: runRolloutScan
      security: []
      parameters:
        - $ref: '#/components/parameters/JobToken'
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'

  /api/jobs/stale-flag-scan:
    post:
      tags: [Jobs]
      operationId: runStaleFlagScan
      security: []
      parameters:
        - $ref: '#/components/parameters/JobToken'
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'

  /api/jobs/partition-roll:
    post:
      tags: [Jobs]
      operationId: runPartitionRoll
      security: []
      parameters:
        - $ref: '#/components/parameters/JobToken'
      responses:
        '200':
          description: Partition maintenance result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        OIDC ID token from any configured identity provider (Auth0, Okta, Entra ID,
        Keycloak, Cognito, Google, Firebase), or a dev token (Bearer dev:email) in the
        local profile.
    sdkKeyAuth:
      type: http
      scheme: bearer
      description: Environment SDK key (sb_srv_...).
    ofrepApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        OFREP's apiKey scheme, carrying the same environment SDK key (sb_srv_...) as sdkKeyAuth.
        Both headers resolve to the same SdkKeyPrincipal; Authorization wins when both are sent.

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvId:
      name: envId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlagKey:
      name: flagKey
      in: path
      required: true
      schema:
        type: string
    EnvKey:
      name: envKey
      in: path
      required: true
      schema:
        type: string
    SegmentKey:
      name: segmentKey
      in: path
      required: true
      schema:
        type: string
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChangeRequestId:
      name: changeRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobToken:
      name: X-Job-Token
      in: header
      required: true
      schema:
        type: string

  schemas:
    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [NOT_FOUND, FORBIDDEN, CONFLICT, VALIDATION_FAILED, UNAUTHORIZED, AI_UNAVAILABLE, UPGRADE_REQUIRED]
        message:
          type: string

    UserResponse:
      type: object
      required: [id, email, onboardingCompleted, memberships]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        onboardingCompleted:
          type: boolean
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/UserMembership'

    UserMembership:
      type: object
      required: [orgId, orgName, orgSlug, role]
      properties:
        orgId:
          type: string
          format: uuid
        orgName:
          type: string
        orgSlug:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'

    OrgRole:
      type: string
      enum: [OWNER, MEMBER]

    OrgCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    OrgResponse:
      type: object
      required: [id, name, slug, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
        createdAt:
          type: string
          format: date-time

    OrgMemberResponse:
      type: object
      required: [userId, email, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
        joinedAt:
          type: string
          format: date-time

    OrgMemberAddRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'

    OrgSettingsResponse:
      type: object
      required: [aiEnabled, autoRollbackEnabled, autoOptimizeEnabled, staleFlagWeeks]
      properties:
        aiEnabled:
          type: boolean
        autoRollbackEnabled:
          type: boolean
        autoOptimizeEnabled:
          type: boolean
        staleFlagWeeks:
          type: integer
        notificationWebhookSet:
          type: boolean

    OrgSettingsUpdateRequest:
      type: object
      properties:
        aiEnabled:
          type: boolean
        autoRollbackEnabled:
          type: boolean
        autoOptimizeEnabled:
          type: boolean
        staleFlagWeeks:
          type: integer
          minimum: 1
          maximum: 52
        notificationWebhookUrl:
          type: string

    ProjectCreateRequest:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 100

    ProjectUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    ProjectResponse:
      type: object
      required: [id, orgId, key, name, environments]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        environments:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentResponse'

    EnvironmentCreateRequest:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
          maxLength: 64
        name:
          type: string

    EnvironmentResponse:
      type: object
      required: [id, projectId, key, name, stateVersion]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        stateVersion:
          type: integer
          format: int64
        approvals:
          $ref: '#/components/schemas/ApprovalSettingsResponse'

    SdkKeyCreateRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 100

    SdkKeyCreatedResponse:
      type: object
      required: [id, environmentId, key, keyPrefix, createdAt]
      properties:
        id:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        key:
          type: string
          description: Full SDK key. Returned only at creation.
        keyPrefix:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time

    SdkKeyResponse:
      type: object
      required: [id, environmentId, keyPrefix, createdAt]
      properties:
        id:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        keyPrefix:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    FlagKind:
      type: string
      enum: [BOOLEAN, STRING]

    Variation:
      type: object
      required: [id, value]
      properties:
        id:
          type: string
          format: uuid
        value:
          type: string
        name:
          type: string

    VariationCreate:
      type: object
      required: [value]
      properties:
        value:
          type: string
        name:
          type: string

    FlagCreateRequest:
      type: object
      required: [key, name, kind]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        kind:
          $ref: '#/components/schemas/FlagKind'
        variations:
          type: array
          description: Required for STRING flags; ignored for BOOLEAN (always true/false).
          items:
            $ref: '#/components/schemas/VariationCreate'
        tags:
          type: array
          items:
            type: string

    FlagUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        addVariations:
          type: array
          description: STRING flags only; variations are add-only.
          items:
            $ref: '#/components/schemas/VariationCreate'

    ClauseOp:
      type: string
      enum: [EQUALS, IN, CONTAINS, STARTS_WITH, SEGMENT_MATCH, NOT_SEGMENT_MATCH]

    Clause:
      type: object
      required: [attribute, op, values]
      properties:
        attribute:
          type: string
          description: Context attribute name; 'key' targets the context key. For SEGMENT_MATCH ops, values carry segment keys.
        op:
          $ref: '#/components/schemas/ClauseOp'
        values:
          type: array
          items:
            type: string

    WeightedVariation:
      type: object
      required: [variationId, weight]
      properties:
        variationId:
          type: string
          format: uuid
        weight:
