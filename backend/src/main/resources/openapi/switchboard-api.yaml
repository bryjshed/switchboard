      required: [id, clauses, serve]
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        clauses:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Clause'
        serve:
          $ref: '#/components/schemas/RolloutOrVariation'

    FlagTargetingConfig:
