# Static hosting for the dashboard SPA.
#
# Three things here are load-bearing and the rest is default:
#
#   1. History fallback. Every dashboard route is client-side, so a hard refresh on
#      /flags/checkout must serve index.html rather than 404.
#   2. config.js is never cached. It is the one file that differs between deployments of the
#      same image, and a cached copy means a browser talking to the previous environment's API
#      with no way to tell.
#   3. index.html is never cached either, because it names the hashed bundle. Caching it is how
#      a browser ends up requesting a chunk that no longer exists after a deploy.
#
# ## Why the security headers are repeated
#
# nginx's `add_header` does not merge: a location block with ANY add_header of its own discards
# every one inherited from the server. So the obvious arrangement -- security headers at server
# level, Cache-Control per location -- silently serves the main page with no security headers
# at all. Worse, `/` reaches index.html through try_files, which is an internal redirect that
# re-matches locations, so `location = /index.html` wins even for a request to `/`. Repeating
# them is not redundancy; it is the only thing that works.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The container runs unprivileged, so nothing may write to /var/log/nginx.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames, so this is safe to cache hard and expensive not to.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
